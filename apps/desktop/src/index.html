<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Petbot</title>
    <style>
      /* Transparent all the way down — the window is a hole in the desktop and
         any painted background would show as a grey square over everything. */
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
      #pet { width: 100vw; height: 100vh; display: grid; place-items: center; }
      #pet svg { width: 160px; height: 160px; cursor: grab; }
      #pet svg:active { cursor: grabbing; }
    </style>
  </head>
  <body>
    <div id="pet"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
