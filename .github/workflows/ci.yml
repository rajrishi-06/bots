name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      # The suites for @bots/db and @bots/rag run against a real Postgres with
      # real pgvector on purpose — tenant isolation and hybrid search are exactly
      # the things a mocked database would report as working while broken.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bots
          POSTGRES_PASSWORD: bots
          POSTGRES_DB: bots
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U bots -d bots"
          --health-interval 3s --health-timeout 3s --health-retries 20

      # The API's rate limiter and quota counter are backed by Redis, and its
      # tests exercise both against a real one rather than a fake — a mocked
      # limiter would pass while the sliding window was broken.
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20

    env:
      MIGRATION_DATABASE_URL: postgres://bots:bots@localhost:5433/bots
      DATABASE_URL: postgres://bots_app:test@localhost:5433/bots
      REDIS_URL: redis://localhost:6380

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.11.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bots/db migrate
      - run: pnpm typecheck
      - run: pnpm test
      # A fat embeddable is a dead embeddable. 30 kB for the widget, 2 kB for
      # the loader — enforced here, not in a comment somebody stops reading.
      - run: pnpm --filter @bots/widget --filter @bots/sdk-js run size
